services:
  postgres:
    image: postgres:16
    container_name: pview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flowdoc}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pview-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pview-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-flowdoc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flowdoc}}
      API_PORT: ${API_PORT:-3001}
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-}
      OAUTH2_CLIENTID: ${OAUTH2_CLIENTID:-}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-}
      OAUTH2_SCOPE: ${OAUTH2_SCOPE:-}
      WEB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  pview-postgres-data:
    name: pview-postgres-data
